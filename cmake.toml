# Reference: https://build-cpp.github.io/cmkr/cmake-toml
[project]
name = "NXTCacheLibrary"
version = "0.1.0"
description = "C++ library for reading the RuneScape NXT cache (sqlite-backed jcache files)"
languages = ["CXX"]
cmake-before = """
# Static deps (sqlite3, zlib, bzip2) get baked into NXTCache.dll so it ships as
# a single file. Use the -md variant to keep the dynamic CRT — required for
# loading from the JVM (which links /MD) without CRT heap-ownership conflicts.
# Windows only: on Linux, vcpkg defaults to the already-static x64-linux triplet.
# CMAKE_HOST_WIN32 is set before project(), unlike WIN32.
if(CMAKE_HOST_WIN32)
    set(VCPKG_TARGET_TRIPLET x64-windows-static-md)
endif()

if(NOT DEFINED CMAKE_CXX_STANDARD)
    set(CMAKE_CXX_STANDARD 20)
endif()
set(CMAKE_CXX_STANDARD_REQUIRED ON)
set(CMAKE_CXX_EXTENSIONS OFF)
"""
cmake-after = """
if(MSVC)
    add_compile_definitions(_CRT_SECURE_NO_WARNINGS NOMINMAX)
    add_compile_options(/utf-8)
endif()
"""

[options]
NXTCACHE_BUILD_DUMPER = true
NXTCACHE_BUILD_MIRROR = true

[conditions]
build-dumper = "NXTCACHE_BUILD_DUMPER"
build-mirror = "NXTCACHE_BUILD_MIRROR"

[vcpkg]
version = "2025.06.13"
# curl[ssl] resolves the default SSL backend per triplet: Schannel on Windows
# (no OpenSSL pulled), OpenSSL on Linux. Backs the HTTPS jav_config fetch.
packages = ["sqlite3", "zlib", "bzip2", "liblzma", "curl[ssl]"]

[find-package]
unofficial-sqlite3 = { }
ZLIB = { }
BZip2 = { }
LibLZMA = { }
CURL = { }

[fetch-content.nlohmann_json]
git = "https://github.com/nlohmann/json.git"
tag = "v3.11.3"
shallow = true

[target.NXTCache]
type = "shared"
sources = [
    "src/core/*.cpp",
    "src/config_types/*.cpp",
    "src/maps/*.cpp",
    "src/network/*.cpp",
    "src/render/*.cpp",
    "src/c_api/*.cpp",
]
headers = [
    "src/core/*.h",
    "src/gzip/*.hpp",
    "src/config_types/*.h",
    "src/maps/*.h",
    "src/network/*.h",
    "src/render/*.h",
    "src/c_api/*.h",
    "src/dumper/Json.h",
]
include-directories = ["src"]
link-libraries = [
    "unofficial::sqlite3::sqlite3",
    "ZLIB::ZLIB",
    "BZip2::BZip2",
    "LibLZMA::LibLZMA",
    "nlohmann_json::nlohmann_json",
    "CURL::libcurl",
]
# Winsock is Windows-only; on Linux the BSD socket API lives in libc.
windows.link-libraries = ["ws2_32"]
compile-features = ["cxx_std_20"]
properties.WINDOWS_EXPORT_ALL_SYMBOLS = true

[target.nxtcache-dumper]
condition = "build-dumper"
type = "executable"
sources = ["src/dumper/*.cpp"]
headers = ["src/dumper/*.h"]
include-directories = ["src"]
link-libraries = [
    "NXTCache",
    "nlohmann_json::nlohmann_json",
]
compile-features = ["cxx_std_20"]

# Byte-faithful JS5 -> .jcache mirror. Links sqlite3 directly because it writes
# the cache files itself (the library is only used for the JS5 network protocol).
[target.nxtcache-mirror]
condition = "build-mirror"
type = "executable"
sources = ["src/mirror/*.cpp"]
include-directories = ["src"]
link-libraries = [
    "NXTCache",
    "unofficial::sqlite3::sqlite3",
]
compile-features = ["cxx_std_20"]
